name: Update live market status

# Regenerates live_status.json + the daily candle JSONs from public market data
# on a schedule. It does NOT run the strategy backtest — backtest_results.json
# is produced by the private engine repo and pushed here via a deploy key.

on:
  schedule:
    # Reliable EOD backbone: post-close runs after CBOE publishes the day's
    # end-of-day prints. 21:35/22:35/23:35 UTC covers ~4:35–7:35pm ET across
    # EST/EDT, with redundancy in case GitHub delays/skips one.
    # (GitHub throttles high-frequency schedules, so we do NOT poll every 5 min
    #  here — intraday refresh is driven externally via workflow_dispatch,
    #  e.g. cron-job.org; see the VIX project's LIVE-REFRESH.md pattern.)
    - cron: "35 21,22,23 * * 1-5"
  workflow_dispatch: {}   # manual runs + external trigger (cron-job.org etc.)

# Serialise runs (two jobs pushing at once would race on git push) but do NOT
# cancel a run that is already going.
#
# cancel-in-progress: true caused a hard deadlock on 2026-08-06: every 5-minute
# ping killed the still-running previous job, so during busy periods — when runner
# acquisition plus the job itself exceeded the 5-minute ping interval — NOTHING
# ever completed. 68 of 100 runs that afternoon were cancelled, each with a
# duration pinned at ~300s (exactly the ping interval), against an 80-95s normal
# runtime. The dashboard sat on stale quotes and showed DELAYED for hours.
concurrency:
  group: update-live
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # Backstop so a hung upstream fetch can't block the run queued behind it.
    # Deliberately NOT tighter: evening runs finish in ~90s, but during market
    # hours (slower upstream fetches, busier runners) they legitimately take
    # 3-6 min, so a 5-6 min timeout would kill healthy runs.
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                     # reuse the wheel cache instead of re-resolving
          cache-dependency-path: .github/workflows/requirements.txt

      - name: Install dependencies
        run: pip install --quiet -r .github/workflows/requirements.txt

      - name: Refresh data
        run: |
          python build_ohlc.py    # daily candles incl. the current forming day
          python update_live.py   # live quotes + position + derived readings

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live_status.json tqqq_ohlc.json sqqq_ohlc.json qqq_ohlc.json spy_ohlc.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh live data [skip ci]"
            # Retry around a concurrent push (the private engine repo also pushes
            # backtest_results.json here via its deploy key).
            for i in 1 2 3; do
              git push && break
              echo "push rejected - rebasing on origin/main (attempt $i)"
              git pull --rebase --autostash origin main || true
              sleep 3
            done
          else
            echo "No data changes — nothing to commit."
          fi
